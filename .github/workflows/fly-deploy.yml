# Deploys to Fly.io on every push to main (i.e. merged PRs), after CI passes.
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
name: Fly Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy app
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-group    # only one deploy at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check secrets
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
        run: '[ -n "$VITE_MAPTILER_KEY" ] || echo "::warning::VITE_MAPTILER_KEY is not set; /map will show a missing-key message"'
      - run: flyctl deploy --remote-only --build-arg VITE_MAPTILER_KEY="$VITE_MAPTILER_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
