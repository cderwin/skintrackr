# `just test` and `just check`. Runs on PRs, and is reused by fly-deploy.yml so main only deploys when it passes.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Test and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's frontend stage.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # tippecanoe builds the map's tiles; the tests run it. Same version as the Dockerfile, built once and cached.
      - name: tippecanoe version
        id: tippecanoe
        run: echo "version=$(sed -n 's/^ARG TIPPECANOE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: tippecanoe-cache
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-${{ steps.tippecanoe.outputs.version }}-${{ runner.os }}
      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "${{ steps.tippecanoe.outputs.version }}" https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)" tippecanoe
          install -D "$RUNNER_TEMP/tippecanoe/tippecanoe" ~/.local/bin/tippecanoe
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Python version comes from python/.python-version; --locked fails if uv.lock is stale.
      - run: uv sync --locked
        working-directory: python
      - run: just web-install
      - run: just test
      - run: just check
